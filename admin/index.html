<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración | La Especie</title>
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <!-- Decap CMS CDN Script -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Load style.css for article body formatting (markdown images, links, quotes, etc.)
      CMS.registerPreviewStyle("/style.css");

      // Custom editor component for inline related news (Lee de otra Especie)
      CMS.registerEditorComponent({
        id: "relacionado",
        label: "Lee de otra Especie",
        fields: [
          { name: "id", label: "ID/Link del artículo (ej: 2026-07-26-el-papel-clave...)", widget: "string" },
          { name: "texto", label: "Texto a mostrar (título de la nota)", widget: "string" }
        ],
        pattern: /^\[relacionado\]\((.*?)\)\s*\"(.*?)\"$/,
        fromBlock: function(match) {
          return {
            id: match[1],
            texto: match[2]
          };
        },
        toBlock: function(obj) {
          return `[relacionado](${obj.id}) "${obj.texto}"`;
        },
        toPreview: function(obj) {
          return `
            <div style="margin: 20px 0; padding: 15px 20px; border-left: 5px solid #dc2626; background-color: #f8fafc; border-radius: 4px; border: 1px solid #e2e8f0; border-left-width: 5px; font-family: sans-serif;">
              <span style="display: block; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #dc2626; letter-spacing: 1px; margin-bottom: 5px;">Lee de otra Especie...</span>
              <a href="/${obj.id}" style="font-size: 1.1rem; font-weight: bold; color: #1e293b; text-decoration: none;">${obj.texto}</a>
            </div>
          `;
        }
      });

      // Custom preview template for articles to prevent React Error #130 crashes
      CMS.registerPreviewTemplate("posts", ({ entry, widgetFor }) => {
        const title = entry.getIn(['data', 'title']) || 'Sin Título';
        const author = entry.getIn(['data', 'author']) || 'La Especie';
        const date = entry.getIn(['data', 'date']) || '';
        const image = entry.getIn(['data', 'image']);
        const image_caption = entry.getIn(['data', 'image_caption']);
        
        return h('div', { style: { padding: '30px 20px', maxWidth: '700px', margin: '0 auto', fontFamily: 'sans-serif', lineHeight: '1.6', color: '#333' } },
          h('span', { style: { textTransform: 'uppercase', fontSize: '0.75rem', fontWeight: 'bold', color: '#e11d48' } }, 'Previsualización'),
          h('h1', { style: { fontSize: '2rem', marginTop: '10px', marginBottom: '10px', fontFamily: 'Georgia, serif' } }, title),
          h('div', { style: { color: '#666', fontSize: '0.85rem', marginBottom: '20px' } }, 
            h('span', {}, 'Por '),
            h('strong', {}, author),
            date ? h('span', {}, ' | ' + new Date(date).toLocaleDateString('es-ES')) : null
          ),
          image ? h('div', { style: { marginBottom: '25px', textAlign: 'center' } },
            h('img', { src: image, style: { display: 'block', maxWidth: '600px', width: '100%', maxHeight: '350px', objectFit: 'cover', borderRadius: '8px', margin: '0 auto', border: '1px solid #ddd' } }),
            image_caption ? h('p', { style: { fontSize: '0.8rem', color: '#666', fontStyle: 'italic', marginTop: '5px', textAlign: 'center' } }, image_caption) : null
          ) : null,
          h('hr', { style: { border: 'none', borderTop: '1px solid #eee', marginBottom: '20px' } }),
          h('div', { style: { fontSize: '1.05rem', color: '#222' } }, widgetFor('body'))
        );
      });
    </script>
</body>
</html>
